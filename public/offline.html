<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0064f0" />
    <title>Paylo — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #ffffff;
        color: #0f172a;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 360px;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
      }
      img {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        display: block;
        border-radius: 16px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #64748b; font-size: 14px; line-height: 1.5; }
      button {
        border: 0;
        background: #0064f0;
        color: white;
        font-weight: 600;
        border-radius: 14px;
        height: 44px;
        padding: 0 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/paylo_applogo.png" alt="Paylo" />
      <h1>You're offline</h1>
      <p>Paylo can't reach the network right now. Cached screens may still work when you reopen the app.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
